<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0f1b2e"/>
      <stop offset="1" stop-color="#111a33"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38e0ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38e0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8a6bff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#8a6bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="phoneBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2a44"/>
      <stop offset="1" stop-color="#141d33"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12213a"/>
      <stop offset="1" stop-color="#0b1526"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38e0ff"/>
      <stop offset="1" stop-color="#8a6bff"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>

  <circle cx="900" cy="90" r="220" fill="url(#glow1)"/>
  <circle cx="1000" cy="270" r="180" fill="url(#glow2)"/>

  <g opacity="0.08" stroke="#5ad8ff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="130" x2="1200" y2="130"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="350" y1="0" x2="350" y2="360"/>
    <line x1="550" y1="0" x2="550" y2="360"/>
  </g>

  <!-- Phone 1 (source, notification origin) -->
  <g transform="translate(760,110)">
    <rect x="0" y="0" width="90" height="150" rx="14" fill="url(#phoneBody)" stroke="#33507a" stroke-width="2"/>
    <rect x="8" y="12" width="74" height="112" rx="6" fill="url(#screenGrad)"/>
    <circle cx="45" cy="136" r="5" fill="#33507a"/>
    <rect x="18" y="24" width="54" height="18" rx="4" fill="#1e3350" stroke="#38e0ff" stroke-width="1.5"/>
    <circle cx="26" cy="33" r="4" fill="#38e0ff"/>
    <line x1="36" y1="30" x2="66" y2="30" stroke="#8fdcff" stroke-width="1.5"/>
    <line x1="36" y1="36" x2="58" y2="36" stroke="#5c7aa0" stroke-width="1.5"/>
  </g>

  <!-- Phone 2 (destination, receives forwarded notification) -->
  <g transform="translate(1020,60)">
    <rect x="0" y="0" width="100" height="170" rx="16" fill="url(#phoneBody)" stroke="#4a6fb0" stroke-width="2"/>
    <rect x="9" y="14" width="82" height="126" rx="6" fill="url(#screenGrad)"/>
    <circle cx="50" cy="154" r="5" fill="#4a6fb0"/>
    <rect x="20" y="30" width="60" height="20" rx="5" fill="#20335a" stroke="#8a6bff" stroke-width="1.8"/>
    <circle cx="30" cy="40" r="4.5" fill="#8a6bff"/>
    <line x1="42" y1="36" x2="72" y2="36" stroke="#c7bbff" stroke-width="1.6"/>
    <line x1="42" y1="43" x2="62" y2="43" stroke="#7d8fc0" stroke-width="1.6"/>
  </g>

  <!-- forwarding arc / signal path -->
  <path d="M 860 175 Q 940 100 1020 130" fill="none" stroke="url(#signal)" stroke-width="3" stroke-dasharray="6 8" opacity="0.85"/>
  <circle cx="900" cy="140" r="5" fill="#38e0ff"/>
  <circle cx="945" cy="112" r="4" fill="#5fc9ff"/>
  <circle cx="990" cy="118" r="4.5" fill="#8a6bff"/>

  <!-- small bell glyph floating near arc -->
  <g transform="translate(895,170)" opacity="0.9">
    <path d="M0 10 C0 -6 16 -6 16 10 L18 16 L-2 16 Z" fill="#38e0ff"/>
    <circle cx="8" cy="19" r="3" fill="#8fdcff"/>
  </g>

  <!-- headline -->
  <text x="60" y="150" font-family="'Segoe UI', Arial, sans-serif" font-size="66" font-weight="700" fill="#f2f7ff" textLength="600" lengthAdjust="spacingAndGlyphs">
    Notification
  </text>
  <text x="60" y="222" font-family="'Segoe UI', Arial, sans-serif" font-size="66" font-weight="700" fill="#f2f7ff" textLength="640" lengthAdjust="spacingAndGlyphs">
    Forwarder
  </text>

  <!-- tagline -->
  <text x="60" y="266" font-family="'Segoe UI', Arial, sans-serif" font-size="21" fill="#a9c3e6" textLength="1000" lengthAdjust="spacingAndGlyphs">
    Forwards Windows notifications to your phone or another device with minimal fuss.
  </text>

  <!-- small decorative dot trail beneath text -->
  <g fill="#38e0ff" opacity="0.6">
    <circle cx="64" cy="292" r="3"/>
    <circle cx="80" cy="292" r="3"/>
    <circle cx="96" cy="292" r="3"/>
  </g>
</svg>